name: Fetch Groq Models
on: [workflow_dispatch]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          curl -s -H "Authorization: Bearer $GROQ_API_KEY" https://api.groq.com/openai/v1/models | jq '.data[].id'
